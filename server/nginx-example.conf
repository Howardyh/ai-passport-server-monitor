# Include from the nginx http {} context (e.g. sites-enabled).
# Replace status.example.com and use an existing valid public-CA certificate.
limit_req_zone $binary_remote_addr zone=passport_status:1m rate=2r/s;
server {
    listen 443 ssl;
    server_name status.example.com;
    ssl_certificate /etc/letsencrypt/live/status.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;

    location = /api/v1/status {
        # The device does not follow redirects and only uses this GET route.
        if ($request_method != GET) { return 405; }
        limit_req zone=passport_status burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "close";
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location / { return 404; }
}
